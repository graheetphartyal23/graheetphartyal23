  <!-- Bio -->
  <text x="0" y="156" class="bio">I'm a Computer Science student at UPES Dehradun with a strong focus on cloud-native engineering,</text>
  <text x="0" y="176" class="bio">full-stack development, and applied machine learning. I design and ship systems end-to-end — from</text>
